# 수집 설정 — 비밀값은 여기 두지 않는다.
# API 키는 환경변수로 넣는다 (app/sources/registry.py 의 key_env 참고):
#   APPLYHOME_API_KEY   청약홈 공식 오픈API  https://www.data.go.kr/data/15098547/openapi.do
#   LH_API_KEY          LH 분양임대공고문    https://www.data.go.kr/data/15058530/openapi.do

sources:
  applyhome:
    enabled: true
    back_months: 1       # 지난 몇 개월까지
    ahead_months: 6      # 앞으로 몇 개월까지
    detail_limit: 40     # 상세까지 보강할 공고 수 (접수 중/임박 우선)

  # 청약홈 공식 오픈API — 공개 화면과 같은 범위를 권위 있는 값으로 보강한다.
  # APPLYHOME_API_KEY 가 없으면 자동으로 '키 미설정' 처리된다.
  applyhome_api:
    enabled: true
    lookback_days: 60    # 모집공고일 기준 과거 며칠까지
    per_page: 300
    max_pages: 10

  lh:
    enabled: true        # LH_API_KEY 가 없으면 자동으로 '키 미설정' 처리된다
    # 05 분양주택 · 06 임대주택 · 13 주거복지(매입·전세임대) · 39 신혼희망타운
    upp_types: ["05", "06", "13", "39"]
    max_pages: 5
    # detail_limit / supply_limit 은 **실제 API 호출 수** 상한이다.
    # 캐시 히트는 소모하지 않으므로 수집을 거듭하면 커버리지가 넓어진다.
    # 접수 중인 LH 공고가 보통 50건 안쪽이라 60 이면 한 번에 다 덮는다.
    detail_limit: 60
    supply_limit: 40

  sh:
    enabled: true
    pages: 3

  youth:
    enabled: true
    # 이 게시판은 '추가모집'이 압도적이라(실측 80건 중 73건) 2페이지만 읽으면
    # 최신 20건이 전부 추가모집이고 **최초모집이 통째로 빠진다.**
    # 6페이지(60건)면 최초모집까지 덮는다. 한 페이지당 0.7초 지연이라 ~4초.
    pages: 6

  # SH 홈페이지 게시판(i-sh.co.kr)
  # robots.txt 가 ClaudeBot 등 AI 에이전트를 명시적으로 Disallow 하고 있어
  # 기본값을 끔으로 둔다. 켤지는 사용자가 판단한다.
  ish:
    enabled: false
    pages: 2
