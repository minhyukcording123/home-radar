# HOME RADAR 공고 주기 수집 — GitHub Actions (무료).
#
# 왜 밖에서 두드리나
#   무료 호스팅은 접속이 없으면 인스턴스를 재운다. 잠든 서버 안에서는
#   타이머가 돌지 않으므로 '서버 안의 스케줄러'는 믿을 수 없다.
#   그래서 밖에서 주기적으로 깨우고 수집을 시킨다.
#
# 비용
#   공개 저장소는 Actions 가 무료, 비공개 저장소도 월 2,000분이 무료다.
#   이 작업은 한 번에 몇 초라 한 달에 다 합쳐도 10분이 안 된다.
#
# 준비 (저장소 Settings → Secrets and variables → Actions)
#   secret   APP_URL     예: https://home-radar.onrender.com   (끝에 / 없이)
#   secret   CRON_TOKEN  Render 환경변수에 넣은 것과 같은 값
#
# 주의
#   GitHub 의 예약 실행은 '정확히 그 시각'을 보장하지 않는다 (보통 몇 분 늦고,
#   혼잡하면 건너뛰기도 한다). 공고 마감이 분 단위로 급한 일은 아니라 괜찮고,
#   혹시 걸러져도 앱이 화면을 열 때 신선도를 확인해 스스로 다시 수집한다.

name: 공고 수집

on:
  schedule:
    # UTC 기준. 한국시간(KST) = UTC+9.
    # 매시 20분, 하루 24번 — 무료 플랜의 750 인스턴스시간 안에 넉넉히 들어간다.
    - cron: "20 * * * *"
  workflow_dispatch:        # 수동 실행 버튼

# 앞 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다
concurrency:
  group: home-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 서버를 깨우고 수집을 요청한다
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_TOKEN:-}" ]; then
            echo "::error::APP_URL 또는 CRON_TOKEN 시크릿이 비어 있습니다."
            exit 1
          fi

          # 1) 깨우기 — 잠든 인스턴스는 첫 응답까지 1분 가까이 걸릴 수 있다.
          #    --max-time 을 넉넉히 주고, 실패해도 다음 단계로 넘어간다.
          echo "깨우는 중…"
          curl -sS --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
               -o /dev/null -w "  /healthz → %{http_code} (%{time_total}s)\n" \
               "$APP_URL/healthz" || echo "  (깨우기 응답 없음 — 그래도 계속)"

          # 2) 수집 요청. 토큰은 URL 쿼리로 가지만 HTTPS 라 전송 중에는 암호화된다.
          #    --fail-with-body 로 404(토큰 불일치)를 실패로 잡는다.
          echo "수집 요청…"
          body=$(curl -sS --max-time 120 --fail-with-body \
                      -X POST "$APP_URL/api/cron/refresh?token=$CRON_TOKEN")
          echo "  응답: $body"

          # 토큰이 틀리면 404 가 오고 위에서 이미 실패한다.
          # 여기까지 왔으면 수집이 시작됐거나 이미 돌고 있다는 뜻이다.
          echo "::notice::수집 요청 완료"
